global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "delivery_service"
    static_configs:
      # Docker Desktop (Windows/Mac, WSL2 integration): there is no docker0 bridge,
      # so the host is reached through host.docker.internal.
      # Native Linux Docker: use the docker0 IP instead, e.g. "172.17.0.1:8000".
      - targets: ["host.docker.internal:8000"]
